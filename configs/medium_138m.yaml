# Tier 2 long-context profile. ~137.8M parameters.
#
# Two choices matter here:
#
# 1. position: rope. A learned position table at 64k tokens would add
#    65536 * 768 = 50.3M parameters, making the advertised parameter count a
#    function of context length. RoPE keeps 137.8M constant from 4k to 64k.
#
# 2. attention_impl: sparse_gather. The dense path materialises (B,H,T,T)
#    scores: at T=65536 with 12 heads in bf16 that is ~103 GB for a single
#    layer's score tensor. The Tier 2 experiment cannot be represented on the
#    dense path at all, on any GPU.
profile: medium_138m
variant: crpa_contribution
multi_seeds: [42, 1337, 2024]
scale_lens: [4096, 8192, 16384, 32768, 65536]

model:
  n_embd: 768
  n_head: 12
  n_layer: 14               # 38.6M tied embeddings + 14 x 7.08M = 137.8M
  dropout: 0.10
  vocab_size: 50257
  block_size: 65536
  position: rope
  partition_size: 512
  n_relays: 32
  cross_k: 8
  route_temp: 0.70
  overlap_rho: 0.60
  attention_impl: sparse_gather

train:
  batch_size: 1
  max_iters: 2000
  eval_iters: 5
  eval_interval: 200
  lr: 2.0e-4
  weight_decay: 0.10
  grad_clip: 1.0
  warmup_steps: 100
  ret_ratio: 0.90
  lambda_bal: 0.01
  lambda_red: 0.05
  seed: 42
  checkpoint_every: 250

contribution:
  eps: 0.03
  interval: 200
  n_pairs: 8
  warmup_steps: 200
  mode: edge
  overlap_threshold: 0.20
  n_samples: 8
  high_overlap_q: 0.75
  low_contribution_q: 0.25
  high_contribution_q: 0.75

data:
  filler_range: [2000, 9999]
  key_range: [100, 119]
  val_range: [120, 139]
  needle_depth_range: [0.55, 0.73]
  needle_depths: [0.1, 0.3, 0.5, 0.7, 0.9]
  n_needles: 2
  dataset_name: wikitext
  dataset_config: wikitext-2-raw-v1
